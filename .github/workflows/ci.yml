name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Python pyproject.toml allows, and the one Dan runs.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The first parse downloads each tree-sitter grammar.
      - run: python -m pytest -q

  minimum:
    # Every direct dependency at the lowest version pyproject.toml allows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: python -m pytest -q
